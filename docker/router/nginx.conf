worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64M;

    # Preserve the real client info forwarded by the host nginx (TLS terminator).
    map $http_x_forwarded_for $forwarded_for {
        default $http_x_forwarded_for;
        ""      $remote_addr;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_real_ip $forwarded_real_ip {
        default $http_x_real_ip;
        ""      $remote_addr;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Static server block(s).
    include /etc/nginx/conf.d/*.conf;
    # Dynamic upstream, rewritten by deploy.sh then gracefully reloaded.
    include /etc/nginx/dynamic/*.conf;
}
