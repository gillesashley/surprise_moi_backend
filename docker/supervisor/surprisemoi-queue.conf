; =============================================================================
; SurpriseMoi Queue Worker Supervisor Configuration — DEPRECATED
; =============================================================================
;
; ⚠️  WARNING: DO NOT USE THIS FILE.
;
; Horizon (supervisord.conf) manages queue workers inside the Docker container.
; Running additional queue workers on the host duplicates Redis connections and
; causes CPU thrashing.
;
; In production, this file should NOT exist in /etc/supervisor/conf.d/.
; Remove or rename it to *.conf.disabled if present.
;
; See: supervisord.conf → [program:horizon]
; =============================================================================

[program:surprisemoi-queue]
command=php /var/www/html/artisan queue:work redis --queue=emails,tokens,default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
process_name=%(program_name)s_%(process_num)02d
numprocs=0
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
exitcodes=0
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0
environment=APP_ENV="production",APP_DEBUG="false",DB_CONNECTION="pgsql",REDIS_CLIENT="phpredis"
priority=999
