# =============================================================================
# SurpriseMoi Backend - Production (blue-green)
#
# Used by deploy.sh. Two interchangeable app slots sit behind a lightweight
# router container on :8082 (where the host nginx already proxies). deploy.sh
# starts the idle slot, waits for health, then flips the router with a
# graceful nginx reload - the old slot keeps serving until the switch.
#
# Note: only the base file is used (docker-compose.override.yml is local dev).
# =============================================================================
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: surprisemoi-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    environment:
      POSTGRES_DB: ${DB_DATABASE:-surprise_moi_db}
      POSTGRES_USER: ${DB_USERNAME:-laraveluser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Gilash@123}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - surprisemoi-network
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laraveluser} -d ${DB_DATABASE:-surprise_moi_db}"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: surprisemoi-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    command: redis-server --appendonly yes --save "" --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD:-Gilash@123}
    volumes:
      - redis-data:/data
    networks:
      - surprisemoi-network
    ports:
      - "63792:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Gilash@123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app-blue: &app
    image: ${APP_IMAGE:-surprisemoi-app:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: surprisemoi-app-blue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CONTAINER_ROLE=app
      - APP_SLOT=blue
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    networks:
      - surprisemoi-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  app-green:
    <<: *app
    container_name: surprisemoi-app-green
    environment:
      - CONTAINER_ROLE=app
      - APP_SLOT=green

  router:
    image: nginx:1.27-alpine
    container_name: surprisemoi-router
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ./docker/router/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/router/server.conf:/etc/nginx/conf.d/server.conf:ro
      - ./.deploy/router:/etc/nginx/dynamic:ro
    networks:
      - surprisemoi-network

networks:
  surprisemoi-network:
    driver: bridge
    name: surprisemoi-network

volumes:
  db-data:
    name: surprisemoi-db-data
  redis-data:
    name: surprisemoi-redis-data
  app-storage:
    name: surprisemoi-app-storage
  app-logs:
    name: surprisemoi-app-logs
